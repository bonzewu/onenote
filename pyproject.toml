[project]
name = "onenote-export"
version = "0.1.0"
description = "把 OneNote（Mac／Windows 桌面版）備份的 .one 節檔案匯出成 Markdown 或 JSON，不需安裝 OneNote，也沒有任何第三方相依套件。"
readme = "README.md"
license = "MIT"
authors = [
    { name = "bonzewu", email = "bonzewu1213@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
keywords = ["onenote", "markdown", "export", "ms-onestore", "backup"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

[project.scripts]
onenote-export = "onenote_export.cli:main"

[dependency-groups]
dev = [
    "markdown-it-py>=4.0",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local_backups: 需要本機 OneNote 備份資料（沒有時自動略過）",
]
addopts = "-ra"

[tool.coverage.run]
source = ["onenote_export"]
branch = true
# e2e 測試以子行程執行 CLI，也要納入覆蓋率
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 允許全形標點（中文說明與訊息）
